 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SketchMind AI | Welcome</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #f1f5f9;
      min-height: 100vh;
    }
    header {
      padding: 24px 7%;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid #24364b;
    }
    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: #123e56;
      color: #55d8eb;
      font-size: 25px;
    }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 5px 0 0; color: #9fb0c4; font-size: 12px; }
    main {
      width: min(1100px, 90%);
      margin: 65px auto;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 50px;
      align-items: center;
    }
    .eyebrow {
      color: #50d7e9;
      letter-spacing: 2px;
      font-size: 12px;
      font-weight: bold;
    }
    h2 {
      font-size: clamp(35px, 5vw, 56px);
      line-height: 1.1;
      margin: 18px 0;
    }
    .description {
      color: #b1c0d2;
      line-height: 1.8;
      max-width: 550px;
    }
    .actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
    a {
      display: inline-block;
      padding: 15px 23px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
    }
    .primary { background: #0899b5; color: white; }
    .secondary { border: 1px solid #40536a; color: #e2e8f0; }
    .visual {
      padding: 35px 25px;
      text-align: center;
      border: 1px solid #294158;
      border-radius: 22px;
      background: linear-gradient(145deg, #122940, #0b1728);
    }
    .visual .symbol { font-size: 100px; color: #5bd7e8; }
    .visual h3 { font-size: 24px; }
    .visual p { color: #aabbd0; line-height: 1.7; }
    .notice { color: #8fa2b9; font-size: 12px; line-height: 1.7; margin-top: 28px; }
    footer { text-align: center; color: #8193a8; padding: 20px; font-size: 12px; }
    @media (max-width: 750px) {
      main { grid-template-columns: 1fr; margin: 40px auto; gap: 30px; }
      header { padding: 20px 5%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">⌕</div>
    <div>
      <h1>SketchMind AI</h1>
      <p>FORENSIC INTELLIGENCE PLATFORM</p>
    </div>
  </header>

  <main>
    <section>
      <p class="eyebrow">AI-POWERED ILLUSTRATION</p>
      <h2>Turn
