
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | SketchMind AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
      font-family: Arial, sans-serif;
      color: #f1f5f9;
      background: #07111f;
    }
    .card {
      width: min(430px, 100%);
      padding: 32px;
      background: #0d192b;
      border: 1px solid #263b53;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0005;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 46px; height: 46px;
      display: grid; place-items: center;
      background: #123e56; color: #55d8eb;
      border-radius: 12px; font-size: 25px;
    }
    h1 { margin: 0; font-size: 21px; }
    .subtitle { margin: 6px 0 0; color: #9aacc2; font-size: 11px; }
    hr { border: 0; border-top: 1px solid #293a50; margin: 25px 0; }
    h2 { text-align: center; margin-bottom: 9px; }
    .intro { text-align: center; color: #9aacc2; font-size: 14px; margin-bottom: 28px; }
    label { display: block; margin: 18px 0 8px; font-size: 13px; }
    input {
      width: 100%; padding: 14px;
      border: 1px solid #344860; border-radius: 10px;
      background: #14243a; color: white; font-size: 15px;
    }
    input:focus { outline: 2px solid #0ba3bf; border-color: transparent; }
    button {
      width: 100%; margin-top: 24px; padding: 15px;
      border: 0; border-radius: 10px;
      background: #079bb8; color: white;
      font-size: 15px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #0786a0; }
    #status { min-height: 20px; font-size: 13px; line-height: 1.5; }
    .back { display: block; text-align: center; margin-top: 20px; color: #5bd7e8; text-decoration: none; font-size: 13px; }
    .warning { margin-top: 20px; color: #9aacc2; font-size: 11px; line-height: 1.6; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo" aria-hidden="true">⌕</div>
      <div>
        <h1>SketchMind AI</h1>
        <p class="subtitle">FORENSIC INTELLIGENCE PLATFORM</p>
      </div>
    </div>

    <hr>

    <h2>Welcome Back</h2>
    <p class="intro">Sign in to access your sketch workspace.</p>

    <form id="loginForm">
      <label for="username">Username or official email</label>
      <input id="username" name="username" type="text"
             placeholder="Enter your username" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             placeholder="Enter your password"
             autocomplete="current-password" required>

      <button type="submit">Continue to Workspace →</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <a class="back" href="welcome.html">← Back to Welcome Page</a>

    <p class="warning">
      Prototype only: this page does not authenticate accounts.
      Do not enter a real password. Backend authentication is required
      before this login can protect your website.
    </p>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const status = document.getElementById("status");

      if (!username || !password.trim()) {
        status.textContent = "Please enter both fields.";
        status.style.color = "#fca5a5";
        return;
      }

      status.textContent =
        "The design is working, but real login verification has not been connected yet.";
      status.style.color = "#fbbf24";
    });
  </script>
</body>
</html>
